<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Wortliste A1 Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, like a phone app. German always appears on a yellow
   town-entry sign (Ortstafel); English on a white supplementary plate (Zusatzzeichen). */
:root {
  --bg: #eff1f4;
  --surface: #ffffff;
  --surface-2: #e6e9ee;
  --ink: #14171c;
  --muted: #59606c;
  --line: #d5d9e0;
  --sign: #f2c500;
  --sign-ink: #121212;
  --plate: #ffffff;
  --btn: #14171c;
  --btn-ink: #ffffff;
  --der: #1f56c4;
  --die: #c42a3a;
  --das: #12804a;
  --ok: #157a42;
  --ok-bg: #e2f3e8;
  --bad: #b8460b;
  --bad-bg: #fbe9de;
  --focus: #1f56c4;
  --der-sign: #1240a6;
  --die-sign: #a60f25;
  --das-sign: #0a6234;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #181b21; --surface-2: #222630; --ink: #eceef2; --muted: #9ba2ae; --line: #2b303a;
    --plate: #f4f5f7; --btn: #f2c500; --btn-ink: #121212;
    --der: #7aa2ff; --die: #ff7482; --das: #4fcf8a; --ok: #46d184; --ok-bg: #12301f; --bad: #ff9a5c; --bad-bg: #3a2014; --focus: #7aa2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #181b21; --surface-2: #222630; --ink: #eceef2; --muted: #9ba2ae; --line: #2b303a;
  --plate: #f4f5f7; --btn: #f2c500; --btn-ink: #121212;
  --der: #7aa2ff; --die: #ff7482; --das: #4fcf8a; --ok: #46d184; --ok-bg: #12301f; --bad: #ff9a5c; --bad-bg: #3a2014; --focus: #7aa2ff;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
#app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: .01em; }
.brand span { font-size: 13px; color: var(--muted); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: var(--ok); }

/* ---------- the sign ---------- */
.sign { background: var(--sign); color: var(--sign-ink); border-radius: 14px; padding: 9px; box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 6px 18px rgba(0,0,0,.08); }
.sign-in { border: 3.5px solid var(--sign-ink); border-radius: 8px; padding: 14px 16px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 120px; justify-content: center; }
.sign .art { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1; letter-spacing: .04em; }
.sign .art.der { color: var(--der-sign); } .sign .art.die { color: var(--die-sign); } .sign .art.das { color: var(--das-sign); }
.sign .art.q { color: var(--sign-ink); opacity: .55; }
.sign .word { font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 10vw, 54px); line-height: 1.02; overflow-wrap: anywhere; }
.sign .sub { font-size: 14px; font-weight: 600; letter-spacing: .02em; margin-top: 6px; }
.sign.small .sign-in { min-height: 0; padding: 10px 14px 9px; }
.sign.small .word { font-size: clamp(28px, 8vw, 40px); }
.plate { background: var(--plate); color: #121212; border: 3px solid #121212; border-radius: 8px; padding: 12px 16px; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.06); }
.plate .pl-k { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #5a5f69; }
.plate .pl-w { font-family: var(--f-display); font-weight: 600; font-size: clamp(26px, 7vw, 36px); line-height: 1.1; }
.plate.small .pl-w { font-size: 22px; }

/* ---------- home ---------- */
.today { display: flex; flex-direction: column; gap: 14px; }
.today .sign-in { min-height: 0; }
.today .sign .word { font-size: clamp(44px, 14vw, 68px); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-display); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); line-height: 1.2; }
@media (max-width: 400px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .35s ease; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: var(--r); border: 0; background: var(--btn); color: var(--btn-ink); font-weight: 700; font-size: 17px; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 160px; }
.sched { font-size: 14px; color: var(--muted); text-align: center; }
.sched b { color: var(--ink); }

.section { display: flex; flex-direction: column; gap: 10px; }
.section h2 { font-family: var(--f-display); font-size: 22px; font-weight: 700; }
.ladder { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.ladder div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 12px; line-height: 1.2; min-width: 0; }
.ladder b { display: block; font-family: var(--f-display); font-size: 17px; }
@media (max-width: 420px) { .ladder { grid-template-columns: repeat(3, 1fr); } }

.grid30 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.tile { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 2px; min-width: 0; }
.tile b { font-family: var(--f-display); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 10px; color: var(--muted); line-height: 1.1; text-align: center; overflow: hidden; max-width: 100%; }
.tile.done { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tile.done span { color: var(--bg); opacity: .75; }
.tile.cur { background: var(--sign); border-color: var(--sign-ink); color: var(--sign-ink); border-width: 2.5px; }
.tile.cur span { color: var(--sign-ink); opacity: .8; }
.tile.rev { border-style: dashed; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1.5px solid var(--line); }
.legend i.d { background: var(--ink); border-color: var(--ink); } .legend i.c { background: var(--sign); border-color: #121212; } .legend i.r { border-style: dashed; }

.cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 400px) { .cards2 { grid-template-columns: 1fr; } }
.mini { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0; }
.mini b { font-weight: 700; font-size: 16px; }
.mini span { font-size: 14px; color: var(--muted); }
.mini:disabled { opacity: .5; cursor: default; }

details.settings { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.settings summary { padding: 14px 16px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
details.settings summary::after { content: "+"; font-weight: 700; }
details.settings[open] summary::after { content: "–"; }
.set-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.field select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.field p { font-size: 13px; color: var(--muted); }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; padding: 10px 6px; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.confirm { background: var(--bad-bg); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* ---------- session ---------- */
.sesbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 12px; padding-block: 6px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.x { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.sesbar .bar { flex: 1; }
.sesbar .cnt { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.task { font-size: 15px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.new { background: var(--sign); color: #121212; }
.stage { display: flex; gap: 4px; }
.stage i { width: 18px; height: 5px; border-radius: 3px; background: var(--surface-2); }
.stage i.on { background: var(--ink); }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 56px; width: 100%; text-align: left; padding: 10px 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); font-size: 18px; font-weight: 500; }
.opt kbd { font-family: var(--f-body); font-size: 12px; font-weight: 700; width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.opt .a-der { color: var(--der); font-weight: 700; } .opt .a-die { color: var(--die); font-weight: 700; } .opt .a-das { color: var(--das); font-weight: 700; }
.gender { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.gender button { min-height: 72px; border-radius: var(--r); border: 2px solid var(--line); background: var(--surface); font-family: var(--f-display); font-size: 30px; font-weight: 700; }
.gender .g-der { color: var(--der); } .gender .g-die { color: var(--die); } .gender .g-das { color: var(--das); }
.gender button.right { border-color: var(--ok); background: var(--ok-bg); } .gender button.wrong { border-color: var(--bad); background: var(--bad-bg); }

.play { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.play svg { width: 16px; height: 16px; }
.bigplay { width: 112px; height: 112px; border-radius: 50%; border: 0; background: var(--sign); color: #121212; display: flex; align-items: center; justify-content: center; margin: 4px auto; box-shadow: inset 0 0 0 5px var(--sign), inset 0 0 0 8.5px #121212; }
.bigplay svg { width: 44px; height: 44px; }
.center { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }

.typebox { display: flex; flex-direction: column; gap: 10px; }
input, textarea, select { box-sizing: border-box; max-width: 100%; }
.typebox input { font: inherit; font-size: 22px; font-weight: 600; padding: 14px 16px; border-radius: var(--r); border: 2px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.typebox input.okc { border-color: var(--ok); } .typebox input.badc { border-color: var(--bad); }
.keys { display: flex; gap: 6px; flex-wrap: wrap; }
.keys button { min-width: 46px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: 18px; font-weight: 600; }
.keys .hint { margin-left: auto; font-size: 14px; padding: 0 12px; }

.mic { width: 120px; height: 120px; border-radius: 50%; border: 0; background: var(--btn); color: var(--btn-ink); display: flex; align-items: center; justify-content: center; margin: 6px auto 0; }
.mic svg { width: 46px; height: 46px; }
.mic.live { background: var(--die); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(196,42,58,.45); } 50% { box-shadow: 0 0 0 16px rgba(196,42,58,0); } }
@media (prefers-reduced-motion: reduce) { .mic.live { animation: none; } .bar > i { transition: none; } }
.score { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.score .num { font-family: var(--f-display); font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score .meter { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.score .meter i { display: block; height: 100%; border-radius: 99px; }
.heard { font-size: 15px; }
.heard q { font-weight: 700; quotes: "„" "“"; }

.fb { border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 1.5px solid; }
.fb.ok { background: var(--ok-bg); border-color: var(--ok); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); }
.fb-h { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1; }
.fb.ok .fb-h { color: var(--ok); } .fb.bad .fb-h { color: var(--bad); }
.fb-a { font-size: 18px; font-weight: 600; }
.fb-a .a-der { color: var(--der); } .fb-a .a-die { color: var(--die); } .fb-a .a-das { color: var(--das); }
.fb-m { font-size: 15px; }
.ex { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.ex .play { padding: 6px 10px; flex: none; }
.ex p { min-width: 0; padding-top: 3px; }
.facts { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.facts .kv { display: flex; gap: 10px; font-size: 15px; }
.facts .kv span:first-child { color: var(--muted); min-width: 64px; }

.sum { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .w { flex: 1; min-width: 0; }
.li .w b { font-weight: 600; } .li .w small { display: block; color: var(--muted); font-size: 13px; }
.li .a-der { color: var(--der); font-weight: 700; } .li .a-die { color: var(--die); font-weight: 700; } .li .a-das { color: var(--das); font-weight: 700; }
.dots { display: flex; gap: 3px; flex: none; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--surface-2); }
.dots i.on { background: var(--ok); }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.iconbtn svg { width: 16px; height: 16px; }
.ex p em, .exline em { display: block; font-style: normal; color: var(--muted); font-size: 14px; }
.exline { display: block; text-align: left; border: 0; background: transparent; padding: 4px 0 0; font-size: 14px; width: 100%; }
.exline span { color: var(--ink); }
.tips { display: flex; flex-direction: column; gap: 4px; }
.tips ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.scorerow { display: flex; align-items: baseline; gap: 12px; }
.verdict { font-family: var(--f-display); font-size: 24px; font-weight: 700; }
.diff { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; font-size: 18px; font-weight: 600; }
.diff .dl { display: inline-block; min-width: 92px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.diff mark { border-radius: 3px; padding: 0 1px; color: var(--surface); }
.diff mark.you { background: var(--bad); text-decoration: line-through; }
.diff mark.fix { background: var(--ok); }
.mapcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 16px; border: 2px solid #121212; background: var(--sign); color: #121212; }
.mapcard .mc-t { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.mapcard b { font-size: 18px; }
.mapcard small { font-size: 14px; }
.mapcard small[lang] { font-weight: 700; font-size: 16px; }
.mapcard .mc-go { font-size: 28px; font-weight: 700; line-height: 1; }
.pmap { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 16px; }
.pmap col.c0 { width: 27%; }
.pmap col.c4 { width: 22%; }
.pmap thead th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 10px 6px 8px; vertical-align: bottom; line-height: 1.25; }
.pmap thead th small { display: block; font-size: 14px; font-weight: 700; color: var(--ink); }
.pmap td, .pmap tbody th { padding: 9px 6px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.pmap td { font-weight: 700; }
.pmap td.same { color: var(--muted); font-weight: 600; }
.pmap tbody th { font-weight: 500; }
.pmap tr.q td, .pmap tr.q th { background: var(--surface-2); }
.rowbtn { display: flex; gap: 6px; align-items: flex-start; background: none; border: 0; padding: 0; color: var(--ink); font: inherit; font-size: 14px; text-align: left; min-height: 24px; }
.rowbtn svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.mapexs .mapex { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; }
.mapex span[lang] { font-weight: 700; font-size: 17px; }
.mapexs .mapex + .mapex { border-top: 1px solid var(--line); }
.mapex small { color: var(--muted); font-size: 13px; }
.today-line { font-size: 15px; color: var(--muted); margin-top: 2px; }
.today-line b { color: var(--ink); }
.course.done { opacity: .82; }
.modlist { display: flex; flex-direction: column; gap: 8px; }
.modrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.modrow .mr-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.modrow .mr-t b { font-size: 19px; font-family: var(--f-display); letter-spacing: .01em; }

"deine","mein"]]},{"id":1155,"b":1,"u":14,"de":"Woher kommen sie?","en":"Where are they from?","n":"","g":["___ kommen sie? (where from)","Woher",["Wo","Woher","Wohin"]]},{"id":1156,"b":1,"u":14,"de":"Wohin geht ihr?","en":"Where are you (all) going?","n":"","g":["Wohin ___ ihr?","geht",["gehst","geht","gehen"]]},{"id":1157,"b":1,"u":14,"de":"Warum kommt er nicht?","en":"Why isn't he coming?","n":"","g":["___ kommt er nicht? (why)","Warum",["Wann","Warum","Wo"]]},{"id":1158,"b":1,"u":14,"de":"Wann kommt deine Schwester?","en":"When is your sister coming?","n":"","g":["Wann kommt ___ Schwester? (your)","deine",["dein","deine","meine"]]},{"id":1159,"b":1,"u":14,"de":"Wie heißt seine Frau?","en":"What is his wife's name?","n":"","g":["Wie heißt ___ Frau? (his)","seine",["sein","seine","ihre"]]},{"id":1196,"b":1,"u":14,"de":"Wer ist sie?","en":"Who is she?","n":"","g":["Wer ___ sie? (she)","ist",["ist","sind","bist"]]},{"id":1197,"b":1,"u":14,"de":"Wo sind sie?","en":"Where are they?","n":"","g":["Wo ___ sie? (they)","sind",["ist","sind","seid"]]},{"id":1160,"b":1,"u":14,"de":"Wir gehen zu ihm.","en":"We're going to his place.","n":"","g":["Wir gehen zu ___. (him)","ihm",["ihn","ihm","er"]]},{"id":1198,"b":1,"u":14,"de":"Wir gehen zu ihr.","en":"We're going to her place.","n":"","g":["Wir gehen zu ___. (her)","ihr",["sie","ihr","ihre"]]},{"id":1199,"b":1,"u":14,"de":"Kennst du ihn?","en":"Do you know him?","n":"","g":["Kennst du ___? (him)","ihn",["ihn","ihm","er"]]},{"id":1200,"b":1,"u":14,"de":"Ich sehe ihn nicht.","en":"I don't see him.","n":"","g":["Ich sehe ___ nicht. (him)","ihn",["ihn","ihm","er"]]},{"id":1201,"b":1,"u":14,"de":"Warum hilfst du ihm?","en":"Why are you helping him?","n":"","g":["Warum hilfst du ___? (him)","ihm",["ihn","ihm","er"]]},{"id":1202,"b":1,"u":14,"de":"Wann besuchst du uns?","en":"When are you visiting us?","n":"","g":["Wann besuchst du ___?","uns",["uns","wir","euch"]]},{"id":1203,"b":1,"u":14,"de":"Woher kennst du sie?","en":"How do you know her?","n":"Literally: from where do you know her?","g":["___ kennst du sie?","Woher",["Wo","Woher","Wohin"]]},{"id":1204,"b":1,"u":14,"de":"Mein Bruder wohnt bei uns.","en":"My brother lives with us.","n":"bei uns = at our place","g":["Mein Bruder wohnt bei ___. (us)","uns",["uns","wir","unser"]]},{"id":1161,"b":1,"u":14,"de":"Ist das dein Auto?","en":"Is that your car?","n":"","g":["___ das dein Auto?","Ist",["Ist","Bist","Sind"]]},{"id":1162,"b":1,"u":14,"de":"Ja, das ist mein Auto.","en":"Yes, that's my car.","n":"","g":["Ja, das ist ___ Auto.","mein",["mein","meine","dein"]]},{"id":1163,"b":1,"u":14,"de":"Nein, das ist nicht mein Auto.","en":"No, that isn't my car.","n":"","g":["Nein, das ist ___ mein Auto.","nicht",["nicht","kein"]]},{"id":1165,"b":1,"u":14,"de":"Wer sind ihre Eltern?","en":"Who are her parents?","n":"","g":["Wer ___ ihre Eltern?","sind",["ist","sind","seid"]]}],"units":[{"u":1,"mod":"verb","de":"Ich bin, du bist","en":"I am, you are (sein)","rule":[["ich bin","I am"],["du bist","you are (one friend)"],["er ist","he is"],["sie ist","she is"],["es ist","it is"],["wir sind","we are"],["ihr seid","you are (friends, group)"],["sie sind","they are"],["Sie sind","you are (polite)"]],"tip":"sein (to be) is irregular, so learn each form by heart. \"Sie\" with a capital S is the polite you, for strangers, officials and at work."},{"u":2,"mod":"verb","de":"Ich habe, du hast","en":"I have, you have (haben)","rule":[["ich habe","I have"],["du hast","you have"],["er / sie / es hat","he / she / it has"],["wir haben","we have"],["ihr habt","you have (group)"],["sie / Sie haben","they have / you have (polite)"]],"tip":"Germans \"have\" hunger and thirst: Ich habe Hunger = I am hungry."},{"u":3,"mod":"verb","de":"Ich wohne, du wohnst","en":"Everyday verbs: live, come, go, speak","rule":[["ich wohne","I live"],["du wohnst","you live"],["er / sie wohnt","he / she lives"],["wir wohnen","we live"],["ihr wohnt","you live (group)"],["sie / Sie wohnen","they live / you live (polite)"]],"tip":"Most verbs follow this pattern: take wohnen, drop -en, add -e, -st, -t, -en, -t, -en. sprechen changes its vowel: du sprichst, er spricht."},{"u":15,"mod":"verb","de":"du fährst, er spricht","en":"Verbs that change: fahren, sprechen, essen","rule":[["ich fahre · du fährst · er fährt","a → ä"],["ich spreche · du sprichst · er spricht","e → i"],["ich esse · du isst · er isst","e → i"],["ich nehme · du nimmst · er nimmt","e → i"],["ich lese · du liest · er liest","e → ie"],["ich sehe · du siehst · er sieht","e → ie"]],"tip":"Some verbs change their vowel, but only for du and er / sie / es. ich, wir, ihr, sie and Sie stay regular: wir fahren, wir sprechen."},{"u":16,"mod":"verb","de":"ich möchte, ich kann, ich muss","en":"would like, can, must (second verb at the end)","rule":[["ich möchte","I would like"],["ich kann","I can"],["ich muss","I must, I have to"],["ich will","I want"],["ich darf","I may, I am allowed"],["Ich kann gut kochen.","the second verb goes to the end"]],"tip":"With these verbs the second verb goes to the very end, unchanged: Ich möchte Deutsch lernen. ich and er have the same form: ich kann, er kann."},{"u":17,"mod":"verb","de":"Ich stehe auf","en":"Verbs that split: aufstehen, anrufen, einkaufen","rule":[["aufstehen","Ich stehe um sieben Uhr auf."],["anrufen","Ich rufe dich an."],["einkaufen","Wir kaufen heute ein."],["mitkommen","Kommst du mit?"],["ankommen","Der Zug kommt um acht Uhr an."]],"tip":"These verbs split in two: the main part goes second, the small front part (auf, an, ein, mit, zu) jumps to the end of the sentence."},{"u":18,"mod":"verb","de":"Komm! Kommen Sie!","en":"Telling someone to do something","rule":[["du kommst → Komm!","to a friend: drop -st"],["Sie kommen → Kommen Sie!","polite: verb first, then Sie"],["du sprichst → Sprich!","the vowel change stays"],["du gibst → Gib!",""],["… bitte","add bitte to sound friendly"]],"tip":"For a friend, take the du form and drop -st: du kommst → Komm! For polite, put Sie after the verb: Kommen Sie! Add bitte to sound friendly."},{"u":4,"mod":"pron","de":"mein, dein","en":"my, your","rule":[["mein Vater · mein Haus","my … (der and das words)"],["meine Mutter · meine Eltern","my … (die words and plurals)"],["dein Vater · dein Haus","your … (der and das words)"],["deine Mutter · deine Eltern","your … (die words and plurals)"]],"tip":"One rule for all of them: add -e before a die word or a plural. mein Vater, meine Mutter."},{"u":5,"mod":"pron","de":"sein, ihr","en":"his, her","rule":[["sein Vater · sein Haus","his … (der and das words)"],["seine Mutter · seine Eltern","his … (die words and plurals)"],["ihr Vater · ihr Haus","her … (der and das words)"],["ihre Mutter · ihre Eltern","her … (die words and plurals)"]],"tip":"his = sein, her = ihr. Same -e rule as mein/meine. Careful: \"sein\" also means \"to be\"; the sentence tells you which."},{"u":6,"mod":"pron","de":"unser, euer, ihr, Ihr","en":"our, your (group), their, your (polite)","rule":[["unser / unsere","our"],["euer / eure","your (a group of friends)"],["ihr / ihre","their"],["Ihr / Ihre","your (polite, capital I)"]],"tip":"ihr means both \"her\" and \"their\". With a capital I, Ihr is the polite \"your\". The -e rule stays the same: unser Haus, unsere Wohnung."},{"u":10,"mod":"pron","de":"mich, dich, ihn","en":"me, you, him … (whom? wen?)","rule":[["mich","me"],["dich","you (one friend)"],["ihn","him"],["sie","her"],["es","it"],["uns","us"],["euch","you (group)"],["sie","them"],["Sie","you (polite)"],["wen?","whom?"]],"tip":"Use these for the person something is done to: after sehen, lieben, kennen, besuchen, fragen, brauchen, and after für. ich → mich, du → dich, er → ihn, wir → uns, ihr → euch. sie, es and Sie stay the same."},{"u":11,"mod":"pron","de":"mir, dir, ihm","en":"to me, to you, to him … (to whom? wem?)","rule":[["mir","(to) me"],["dir","(to) you (one friend)"],["ihm","(to) him, (to) it"],["ihr","(to) her"],["uns","(to) us"],["euch","(to) you (group)"],["ihnen","(to) them"],["Ihnen","(to) you (polite)"],["wem?","to whom?"]],"tip":"Use these after mit, zu, bei, von, aus and after helfen, danken, geben, gehören, gefallen. You already know one: Wie geht es dir? uns and euch look the same as in the last unit."},{"u":12,"mod":"pron","de":"meinen, deinen, seinen","en":"my, your, his … after a verb","rule":[["einen Bruder","a brother (der word after a verb)"],["meinen Vater","my father"],["deinen · seinen · ihren","your · his · her, their"],["unseren · euren · Ihren","our · your (group) · your (polite)"],["meine Mutter · mein Auto","die and das words: no change"],["meine Eltern","plurals: no change"]],"tip":"Only der words change, and only when they are the thing you have, see, visit or need: der Vater → Ich besuche meinen Vater. die, das and plural words stay as they are."},{"u":7,"mod":"frag","de":"Wer, was, wo","en":"who, what, where","rule":[["wer?","who?"],["was?","what?"],["wo?","where?"]],"tip":"Question word first, verb second: Wo wohnst du? Wer ist das?"},{"u":8,"mod":"frag","de":"Woher, wohin, wann, warum","en":"where from, where to, when, why","rule":[["woher?","where from? (with kommen)"],["wohin?","where to? (with gehen, fahren)"],["wann?","when?"],["warum?","why?"]],"tip":"Three kinds of \"where\": wo = where something is, woher = where from, wohin = where to."},{"u":9,"mod":"frag","de":"Wie, wie viel, welche","en":"how, how much, which","rule":[["wie?","how?"],["wie viel?","how much?"],["wie alt?","how old?"],["welcher / welche / welches?","which? (der / die / das word)"]],"tip":"German asks \"how\" where English asks \"what\": Wie heißt du? = What is your name?"},{"u":19,"mod":"frag","de":"Wie viele? Wie lange?","en":"how many, how long, how often, yes/no questions","rule":[["wie viel? · wie viele?","how much? · how many?"],["um wie viel Uhr?","at what time?"],["wie lange? · wie oft?","how long? · how often?"],["wen? · wem? · mit wem?","whom? · to whom? · with whom?"],["Kommst du morgen?","yes/no question: verb first"]],"tip":"wie viel for things you cannot count (Geld, Zeit), wie viele for things you can (Kinder). Questions without a question word start with the verb."},{"u":20,"mod":"art","de":"der, die, das","en":"the: three kinds of nouns","rule":[["der Mann · der Tisch","der words (masculine)"],["die Frau · die Lampe","die words (feminine)"],["das Kind · das Buch","das words (neuter)"],["die Kinder · die Bücher","plural: always die"]],"tip":"Learn every noun with its article. Helpful patterns: words ending in -e are often die (die Lampe), words ending in -chen are always das (das Mädchen), and every plural is die."},{"u":21,"mod":"art","de":"ein, eine","en":"a, an","rule":[["der Mann → ein Mann","der words: ein"],["die Frau → eine Frau","die words: eine"],["das Kind → ein Kind","das words: ein"],["Kinder","plural: no word for \"a\""]],"tip":"ein for der and das words, eine for die words. In the plural there is no \"a\": Ich habe Kinder."},{"u":22,"mod":"art","de":"einen","en":"a … after a verb (der words)","rule":[["Das ist ein Hund.","der word as the subject: ein"],["Ich habe einen Hund.","der word after a verb: einen"],["Ich habe eine Katze.","die words: no change"],["Ich habe ein Auto.","das words: no change"]],"tip":"Only der words change: ein → einen when it is the thing you have, buy, need or see. eine and ein (das words) stay the same."},{"u":23,"mod":"art","de":"den, dem","en":"the … after a verb or after mit","rule":[["Der Bus kommt.","der word as the subject"],["Ich nehme den Bus.","after a verb: der → den"],["mit dem Bus · mit dem Auto","after mit: der / das → dem"],["mit der Bahn","after mit: die → der"],["mit den Kindern","after mit: plural → den …n"]],"tip":"After a verb only der changes: den. After mit, zu, bei, von and aus they all change: dem, der, dem, den. Fixed phrases help: mit dem Bus, mit der Bahn, mit dem Auto."},{"u":24,"mod":"art","de":"kein, keine, keinen","en":"no, not a","rule":[["ein Auto → kein Auto","das words"],["eine Tasche → keine Tasche","die words"],["ein Hund → kein Hund","der words as the subject"],["einen Hund → keinen Hund","der words after a verb"],["Kinder → keine Kinder","plural"]],"tip":"kein means \"not a\" or \"no\", and it changes exactly like ein: kein, keine, keinen. Plural: keine."},{"u":25,"mod":"prep","de":"in, im, ins","en":"in: where? and where to?","rule":[["in Berlin · in Dubai","in + city or country"],["im Büro · im Park","in dem → im (where?)"],["in der Schule","in + die word (where?)"],["ins Kino","in das → ins (where to?)"],["in die Stadt","in + die word (where to?)"]],"tip":"Where are you? im, in der. Where are you going? ins, in die. im = in dem, ins = in das."},{"u":26,"mod":"prep","de":"an, am, auf","en":"at, on, next to","rule":[["auf dem Tisch","on top of"],["an der Wand · an der Tür","on the side of, at"],["am Fenster · am Tisch","an dem → am"],["am Montag · am Abend","days and parts of the day: am"]],"tip":"auf = on top of something. an = at, or on the side of something. am = an dem. Days and evenings use am: am Montag, am Abend."},{"u":27,"mod":"prep","de":"um, im, von … bis","en":"time: at, in, from … to","rule":[["um acht Uhr","at eight o'clock"],["am Montag","on Monday"],["im Mai · im Sommer","in May · in summer"],["von neun bis fünf","from nine to five"],["vor dem Essen · nach dem Essen","before · after the meal"]],"tip":"Clock times: um. Days: am. Months and seasons: im. From … to: von … bis."},{"u":28,"mod":"prep","de":"mit, für, ohne","en":"with, for, without","rule":[["mit Milch · mit dem Bus · mit mir","with (dem, der, mir, dir)"],["für dich · für meine Mutter","for (dich, ihn, den)"],["ohne Zucker · ohne dich","without (dich, ihn, den)"]],"tip":"mit takes the \"to whom\" forms: mit mir, mit dem Bus. für and ohne take the \"whom\" forms: für dich, ohne ihn."},{"u":29,"mod":"prep","de":"zum, zur, nach","en":"going to: a place, a city, home","rule":[["zum Arzt · zum Bahnhof","zu dem → zum (der and das words)"],["zur Schule · zur Bank","zu der <script>
(() => {
'use strict';
const WORDS = JSON.parse(document.getElementById('words').textContent);

const LADDER = [1, 3, 7, 14, 30, 60];
const TOPIC = { hi: 'Greetings & phrases', me: 'Person & family', ti: 'Time & dates', fo: 'Food & drink', sh: 'Shopping & money', ho: 'Home', ci: 'City & travel', se: 'Post, bank & phone', wo: 'Work & learning', fr: 'Free time', he: 'Body & health' };
const TOPIC_DE = { hi: 'Begrüßung', me: 'Person', ti: 'Zeit', fo: 'Essen', sh: 'Einkaufen', ho: 'Wohnen', ci: 'Stadt', se: 'Dienste', wo: 'Arbeit', fr: 'Freizeit', he: 'Körper' };
const app = document.getElementById('app');

/* ================= helpers ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  if (w._p) return w._p;
  if (w.b) { const v = w.de.replace(/[.?!]$/, ''); w._p = { art: '', body: v, kind: 'phrase', variants: [v], spoken: w.de }; return w._p; }

const norm = s => s.toLowerCase().replace(/ß/g, 'ss').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/[^a-z0-9]/g, '');
function lev(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;

const FUNC = new Set('ich du er sie es wir ihr das der die wo wer was wie woher wohin wann warum welche welcher welches mein meine dein deine sein seine unser unsere euer eure bin bist ist sind seid habe hast hat haben habt ja nein gib kannst kommst wohnst gehst'.split(' '));

const ICON = {

};
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600); }

/* ================= state & storage ================= */
const LS_KEY = 'wortliste-a1-trainer-v1';
const fresh = () => ({ v: 1, start: null, set: 1, bu: 1, dn: {}, w: {}, days: {}, streak: 0, last: null, opt: { speak: 'auto', audio: true, rate: 0.9, voice: '' }, upd: 0 });
let S = fresh();
function adopt(o) { if (!o || typeof o !== 'object' || !o.w) return false; const f = fresh(); S = Object.assign(f, JSON.parse(JSON.stringify(o))); S.opt = Object.assign(fresh().opt, S.opt || {}); return true; }

function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

const get = id => S.w[id] || ST0;
const mut = id => (S.w[id] = S.w[id] ? S.w[id] : ST0.slice());

async function flush() {

async function initCloud() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);

    if (remote && (remote.upd || 0) > (S.upd || 0)) {

}

}

/* ================= audio: recorded native voice, device voice as fallback ================= */

function answerMC(i) {
  const s = SES; if (s.answered) return;

  let msg = '';
  if (!o.ok) {
    if (o.fakeArt) msg = `Right word, wrong article. It's <b class="a-${parse(w).art}" style="color:var(--${parse(w).art})">${parse(w).art}</b>.`;
    else if (o.w) msg = s.card.mode === 'mcEN' ? `<span lang="de">${deHTML(o.w)}</span> means “${esc(o.w.en)}”.` : `That's <span lang="de">${deHTML(o.w)}</span>.`;
  }
  s.feedback = { ok: o.ok, msg };
  record(o.ok);
  if (o.ok && s.card.mode !== 'listen') playWord(w);
  render();
  if (o.ok) autoNext(900);
}

function answerGap(i) {
  const s = SES; if (s.answered) return;
  const w = s.card.w, pickd = s.card.opts[i], ok = pickd === w.g[1];
  s.picked = i; s.answered = true;
  s.feedback = { ok, msg: ok ? '' : `The right form is <b lang="de">${esc(w.g[1])}</b>, not ${esc(pickd)}.${w.n ? `<br><span class="muted">${esc(w.n)}</span>` : ''}` };
  record(ok); playWord(w); render();
  if (ok) autoNext(1100);
}
function buildCheck() {
  const s = SES, c = s.card; if (s.answered || !c.built.length) return;
  const said = c.built.map(i => c.tiles[i].t.toLowerCase()).join(' ');
  const ok = said === c.target.map(t => t.toLowerCase()).join(' ');
  s.answered = true;
  s.feedback = { ok, msg: ok ? '' : `You built: <span lang="de">${esc(c.built.map(i => c.tiles[i].t).join(' '))}</span>` };
  record(ok); playWord(c.w); render();
}
function answerArt(a) {
  const s = SES; if (s.answered) return;
  const w = s.card.w, p = parse(w); s.answered = true; s.pickedArt = a;
  const ok = a === p.art;
  s.feedback = { ok, msg: ok ? '' : `It's <b style="color:var(--${p.art})">${p.art}</b> ${esc(p.body)}.` };
  record(ok); playWord(w); render();
  if (ok) autoNext(900);
}
function answerTyped() {
  const s = SES; if (s.answered) return;
  const inp = document.getElementById('ans'); s.typed = inp ? inp.value : '';
  const w = s.card.w, p = parse(w), g = gradeTyped(w, s.typed);
  if (g.kind === 'empty') { toast('Type your answer first'); return; }
  let ok = g.ok, head = '';
  if (ok && s.hintN >= 2) ok = false;
  let artNote = '';
  if (g.kind === 'spell' && g.art) artNote = !g.saidArt ? ` Also add the article: <b style="color:var(--${g.art})">${g.art}</b>.` : g.saidArt !== g.art ? ` The article is wrong too: it's <b style="color:var(--${g.art})">${g.art}</b>.` : ' The article is right.';
  const formalMiss = w.b && g.kind === 'exact' && /\b(Sie|Ihr|Ihre|Ihnen)\b/.test(w.de) && /formal|polite|^your/i.test(w.en) && !/\b(Sie|Ihr|Ihre|Ihnen)\b/.test(s.typed);
  const capNote = formalMiss ? 'Tip: the polite <b>Sie / Ihr / Ihnen</b> is always written with a capital letter.' : (g.kind === 'exact' && p.kind === 'noun' && /^(der|die|das\s+)?[a-zäöü]/.test(s.typed.trim().replace(/^(der|die|das)\s+/i, ''))) ? `Tip: German nouns start with a capital letter: <b lang="de">${esc(p.body)}</b>.` : '';
  if (g.kind === 'spell') head = 'Misspelled';
  if (g.kind === 'form') head = 'Wrong form';
  if (g.kind === 'order') head = 'Word order';
  if (g.kind === 'typo' && ok) head = 'Richtig · small typo';
  const msgs = {
    exact: s.hintN ? 'Correct, with a hint.' : capNote,
    typo: `Accepted, but it's slightly misspelled.${g.tBody ? diffHTML(g) : ''}`,
    spell: `Close, but the spelling is wrong.${artNote}${g.tBody ? diffHTML(g) : ''}`,
    syn: g.other ? `<span lang="de">${esc(g.other.de)}</span> is also right. This card's word is:` : '',
    article: `Right word, wrong article: it's <b style="color:var(--${p.art})">${p.art}</b>, not ${esc(g.said || '')}.`,
    noart: `Add the article. Nouns are learned with der, die or das.`,
    form: g.pairs ? `Check the form: ${g.pairs.slice(0, 2).map(([y, t]) => `<b lang="de">${esc(t)}</b>, not ${esc(y)}`).join('; ')}.${w.n ? `<br><span class="muted">${esc(w.n)}</span>` : ''}${g.tBody ? diffHTML(g) : ''}` : '',
    order: `Right words, wrong order.${w.n ? `<br><span class="muted">${esc(w.n)}</span>` : ''}${g.tBody ? diffHTML(g) : ''}`,
    words: `Compare your sentence with the right one.${w.n ? `<br><span class="muted">${esc(w.n)}</span>` : ''}${g.tBody ? diffHTML(g) : ''}`,
    wrong: s.card.mode === 'dictation' ? 'Listen again and compare the spelling.' : (w.b && w.n ? esc(w.n) : '')
  };
  let msg = msgs[g.kind] || '';
  if (g.ok && !ok) msg = 'You needed most of the word as a hint, so this one comes back.';
  s.answered = true; s.feedback = { ok, msg, head };
  record(ok); playWord(w); render();
}
async function doMic(auto) {
  const s = SES; if (!s || s.answered || (s.speech && s.speech.state === 'live')) return;
  const card = s.card;
  s.speech = { state: 'live' }; render();
  try {
    const alts = await listen();
    if (!SES || SES !== s || s.card !== card) return;
    micWorked = true;
    const r = alts.length ? speechScore(card.w, alts) : { s: 0, t: '', art: true };
    s.speech = { state: 'done', score: r.s, heard: r.t, art: r.art, remarks: remarks(card.w, r) };
    const m = mut(card.w.id); m[5] = r.s; touch();
    render();
  } catch (err) {
    if (!SES || SES !== s || s.card !== card) return;
    if (auto) { autoMicOff = true; s.speech = null; render(); return; }
    speechBroken = true; speechWhy = String(err);
    card.mode = 'say'; s.speech = null;
    toast('The microphone did not start. Practise by listening and repeating.');
    render();
  }
}
function tipsHTML(list, label) {
  if (!list || !list.length) return '';
  return `<div class="tips">${label ? `<div class="label">${label}</div>` : ''}<ul>${list.map(t => `<li>${t}</li>`).join('')}</ul></div>`;
}
function xferCopy() {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  const ta = document.getElementById('xfer');
  const done = () => toast('Progress code copied. Paste it into the other version.');
  const fallback = () => { if (ta) { ta.value = code; ta.focus(); ta.select(); } toast('Code is in the box. Copy it from there.'); };
  try { navigator.clipboard.writeText(code).then(done, fallback); } catch (e) { fallback(); }
}
function xferImport() {
  const ta = document.getElementById('xfer'); const raw = (ta && ta.value || '').trim();
  if (!raw) { toast('Paste a progress code into the box first'); return; }
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(raw.replace(/\s+/g, '')))));
    if (!adopt(o)) throw new Error('bad');
    S.upd = Date.now(); touch(); flush(); render(); toast('Progress loaded');
  } catch (e) { toast('That code could not be read. Copy it again, all of it.'); }
}
function speakDone() {
  const s = SES; if (!s || s.answered || !s.speech) return;
  const sc = s.speech.score, ok = sc >= 60;
  s.st.sp += sc; s.st.sn++; const d = dayRec(); d.sp += sc; d.sn++;
  s.answered = true; s.feedback = { ok, msg: ok ? '' : 'Listen to it, then you will meet this word again soon.' };
  record(ok); if (!ok) playWord(s.card.w); render();
}
function hint() {
  const s = SES, p = parse(s.card.w), inp = document.getElementById('ans');
  const target = p.variants[0];
  s.hintN = (s.hintN || 0) + 1;
  const n = Math.min(target.length, (p.art ? p.art.length + 1 : 0) + s.hintN * 2);
  if (inp) { inp.value = target.slice(0, n); inp.focus(); }
}

app.addEventListener('click', e => {
  unlockAudio();
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'FORM' || b.tagName === 'SELECT' || b.tagName === 'TEXTAREA') return;
  const act = b.dataset.act;
  switch (act) {
    case 'daily': startSession(VIEW === 'summary' ? 'next' : 'daily', DECK); break;
    case 'next': if (SES && SES.kind === 'unit' && SES.unit && !unitDone(SES.unit)) startSession('unit', SES.deck, SES.unit); else startSession('next', DECK); break;
    case 'practice': startSession('practice', DECK); break;
    case 'weak': startSession('weak', DECK); break;
    case 'home': SES = null; VIEW = deckHome(); render(); break;
    case 'hub': SES = null; VIEW = 'hub'; render(); break;
    case 'deck': DECK = b.dataset.v; VIEW = deckHome(); render(); break;
    case 'bunit': BUNIT = +b.dataset.n; DECK = UMOD[BUNIT]; VIEW = 'bunit'; render(); break;
    case 'bmap': MAPBACK = VIEW; VIEW = 'bmap'; render(); break;
    case 'mapback': VIEW = MAPBACK === 'bunit' ? 'bunit' : 'bhome'; render(); break;
    case 'pmap': playKey(MAPW[+b.dataset.i], 'r'); break;
    case 'pmapx': playKey(MAPX[+b.dataset.i], 'x'); break;
    case 'learnunit': startSession('unit', UMOD[+b.dataset.n], +b.dataset.n); break;
    case 'gappick': answerGap(+b.dataset.i); break;
    case 'tile': { const c = SES.card, i = +b.dataset.i; if (!SES.answered && !c.tiles[i].used) { c.tiles[i].used = true; c.built.push(i); render(); } break; }
    case 'untile': { const c = SES.card, k = +b.dataset.k; if (!SES.answered) { const i = c.built.splice(k, 1)[0]; c.tiles[i].used = false; render(); } break; }
    case 'buildclear': { const c = SES.card; c.built = []; c.tiles.forEach(t => { t.used = false; }); render(); break; }
    case 'buildcheck': buildCheck(); break;
    case 'browse': BROWSE = +b.dataset.n; VIEW = 'browse'; render(); break;
    case 'quit': clearTimeout(autoT); if (REC) { try { REC.abort(); } catch (er) { /* */ } } quit(); break;
    case 'introok': { const m = mut(SES.card.w.id); m[0] = 1; SES.last.push(SES.card.w.id); touch(); nextCard(); break; }
    case 'pick': answerMC(+b.dataset.i); break;
    case 'art': answerArt(b.dataset.v); break;
    case 'cont': clearTimeout(autoT); nextCard(); break;
    case 'pw': playWord(BYID.get(+b.dataset.id)); break;
    case 'pex': playEx(BYID.get(+b.dataset.id)); break;
    case 'xcopy': xferCopy(); break;
    case 'ximport': xferImport(); break;
    case 'key': { const inp = document.getElementById('ans'); if (inp) { const st = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? st; inp.value = inp.value.slice(0, st) + b.dataset.k + inp.value.slice(en); inp.focus(); inp.setSelectionRange(st + 1, st + 1); } break; }
    case 'hint': hint(); break;
    case 'mic': doMic(false); break;
    case 'micstop': if (REC) try { REC.stop(); } catch (er) { /* */ } break;
    case 'skipmic': SES.card.mode = 'say'; SES.speech = null; render(); break;
    case 'speakdone': speakDone(); break;
    case 'reveal': SES.revealed = true; playWord(SES.card.w); render(); break;
    case 'self': { const ok = b.dataset.v === '1'; SES.answered = true; SES.feedback = { ok, msg: '' }; record(ok); render(); break; }
    case 'opt-speak': S.opt.speak = b.dataset.v; touch(); render(); document.getElementById('settings').open = true; break;
    case 'opt-audio': S.opt.audio = b.dataset.v === '1'; touch(); render(); document.getElementById('settings').open = true; break;
    case 'mictest': micTest(b); break;
    case 'soundtest': { ctxStale = true; unlockAudio(); const hw = WORDS.find(x => x.de === 'hallo'); if (hw) playWord(hw); toast('Playing „hallo“. If you hear nothing, check the volume and the side switch.'); break; }
    case 'reset': CONFIRM_RESET = true; render(); document.getElementById('settings').open = true; break;
    case 'reset-no': CONFIRM_RESET = false; render(); document.getElementById('settings').open = true; break;
    case 'reset-yes': { const opt = S.opt; S = fresh(); S.opt = opt; CONFIRM_RESET = false; touch(); render(); toast('Progress erased'); break; }
  }
});
app.addEventListener('submit', e => { e.preventDefault(); if (SES && !SES.answered) answerTyped(); else if (SES && SES.answered) nextCard(); });
app.addEventListener('input', e => { if (e.target.id === 'ans' && SES) SES.typed = e.target.value; });
async function micTest(b) {
  b.disabled = true; b.textContent = 'Say „Hallo“ now…';
  try {
    const alts = await listen();
    speechBroken = false; speechWhy = ''; micWorked = true; autoMicOff = false;
    toast(alts.length ? `Heard: „${alts[0].t}“. The microphone works.` : 'Nothing heard. Check your microphone and try again.');
  } catch (err) { speechBroken = true; speechWhy = String(err); toast('The microphone is blocked here. Speaking will use "say it aloud".'); }
  render(); const d = document.getElementById('settings'); if (d) d.open = true;
}
document.addEventListener('keydown', e => {
  if (VIEW !== 'session' || !SES || !SES.card) return;
  const inInput = e.target && e.target.id === 'ans';
  const m = SES.card.mode;
  if (!SES.answered && (m === 'mcDE' || m === 'mcEN' || m === 'listen') && /^[1-4]$/.test(e.key) && !inInput) { answerMC(+e.key - 1); e.preventDefault(); return; }
  if (!SES.answered && m === 'gender' && /^[1-3]$/.test(e.key)) { answerArt(ARTS[+e.key - 1]); e.preventDefault(); return; }
  if (!SES.answered && m === 'gap' && /^[1-5]$/.test(e.key) && +e.key <= SES.card.opts.length) { answerGap(+e.key - 1); e.preventDefault(); return; }
  if (e.key === 'Enter' && !inInput) {
    const c = document.getElementById('cont');
    if (c) { c.click(); e.preventDefault(); }
  }
});

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
if (location.hash === '#selftest') window.__wl = { remarks, speechScore, parse, WORDS, BASICS, wordTips, gradeTyped, diffHTML, audioState: () => ({ ctx: ctx && ctx.state, stale: ctxStale, src: !!curSrc, el: !!curEl }), markStale: () => { ctxStale = true; } };
render();
initCloud();
})();
